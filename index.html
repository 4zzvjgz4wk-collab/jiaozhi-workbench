<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>教资备考工作台 · 音乐</title>
<style>
:root{--ink:#1c2333;--sub:#68738c;--line:#e6e9f2;--bg:#f6f7fb;--card:#ffffff;--blue:#2f5cff;--blue-d:#1e3fae;--orange:#ff7a45;--ok:#1fbf75;--bad:#f04452;--soft:#eef2ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
h1{font-size:19px;letter-spacing:.5px}
.sub{color:var(--sub);font-size:12px;margin-top:3px}
.tracks{display:flex;gap:8px;margin-top:12px}
.tracks button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--ink)}
.tracks button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
main{max-width:720px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin-bottom:8px}
.mut{color:var(--sub);font-size:12.5px;line-height:1.6}
.big{font-size:26px;font-weight:700}
.bar{height:9px;border-radius:6px;background:var(--soft);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),#6f8dff);border-radius:6px}
.task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:none}
.task .tt{flex:1}
.task .tt b{font-size:14.5px}
.tag{display:inline-block;font-size:11px;color:var(--blue-d);background:var(--soft);border-radius:6px;padding:2px 7px;margin-right:6px;vertical-align:1px}
.tag.pr1{background:#fde8e0;color:#b3541e}
.tag.pr2{background:#e3edfb;color:#1c5fc2}
.tag.pr3{background:#eef0f3;color:#68707d}
.legend{margin-top:8px;font-size:13px;line-height:2}
.restitle{margin-top:10px;font-weight:700}
.resrow{display:block;padding:7px 0;font-size:14.5px}
.resrow input{width:17px;height:17px;vertical-align:-3px}
.cmdhint{background:#eef6ee;border:1px solid #bcd8bc;border-radius:10px;padding:8px 11px;font-size:13.5px;margin-bottom:10px}
.tag.fw{color:#a34d00;background:#fff3e6}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid #c4cbdd;background:#fff;flex:none;margin-top:1px;font-size:14px;color:#fff;line-height:1}
.chk.done{background:var(--ok);border-color:var(--ok)}
.subj{margin-bottom:14px}
.subj>h3{font-size:15px;padding:4px 2px 8px}
.unit{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;overflow:hidden}
.unit .row{display:flex;gap:10px;align-items:center;padding:11px 12px;cursor:pointer}
.unit .row .tt{flex:1}
.unit .row b{font-size:14.5px;font-weight:600}
.unit .body{display:none;padding:2px 14px 13px 46px}
.unit.open .body{display:block}
.unit .body ul{margin:4px 0 10px 16px}
.unit .body li{font-size:13.5px;line-height:1.75;color:#333c52}
.q{border-top:1px dashed var(--line);padding:10px 0 2px}
.q p{font-size:13.5px;font-weight:600;line-height:1.6;margin-bottom:8px}
.q .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fbfcff;border-radius:9px;padding:8px 10px;font-size:13.5px;margin-bottom:6px;color:var(--ink)}
.q .opt.ok{border-color:var(--ok);background:#eafaf2}
.q .opt.bad{border-color:var(--bad);background:#fdeef0}
.why{display:none;font-size:12.5px;color:var(--sub);line-height:1.65;background:#f7f8fc;border-radius:8px;padding:8px 10px;margin:2px 0 8px}
.why.show{display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;padding:11px 0 9px;font-size:13px;color:var(--sub)}
nav button.on{color:var(--blue);font-weight:700}
.btn{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;background:#fbfcff;color:var(--ink)}
textarea{height:86px;font-size:12px}
.empty{color:var(--sub);text-align:center;padding:22px 0;font-size:13.5px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.kv:last-child{border-bottom:none}
.accent{color:var(--orange);font-weight:700}
.vidlink{display:inline-block;background:var(--soft);color:var(--blue-d);border-radius:8px;padding:7px 12px;font-size:13px;text-decoration:none;margin:2px 0 6px;font-weight:600}
.vrow{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px dashed var(--line);text-decoration:none;color:var(--ink);font-size:14px}
.vrow:last-of-type{border-bottom:none}
.player{position:relative;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden;margin:10px 0 4px}
.player iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}

/* ===== 样本新增：导览 / 全景图 / 讲义层 ===== */
.guide-banner{cursor:pointer;border-color:#bcd6ff;background:#f2f7ff}
.guide-banner b{color:#1c5fc2}
.station{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.station .sno{display:inline-block;background:#1c5fc2;color:#fff;border-radius:8px;font-size:12px;padding:1px 8px;margin-bottom:6px}
.station h3{font-size:16px;margin-bottom:4px}
.station .rule{background:#f2f7ff;border-left:4px solid #1c5fc2;padding:8px 10px;border-radius:0 10px 10px 0;margin:8px 0;font-size:14px}
.station .diag{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.station .chip{background:#eef3fa;border:1px solid #d5e2f2;border-radius:9px;padding:5px 9px;font-size:13px}
.station .plus{color:#8aa5c4;font-weight:700}
.gtest{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.gtest .opt{display:block;width:100%;text-align:left;margin-top:6px}
.pano details{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fbfcfe}
.pano summary{cursor:pointer;padding:9px 12px;font-weight:600;list-style:none}
.pano summary::-webkit-details-marker{display:none}
.pano .leaf{margin:2px 0 2px 18px;font-size:13.5px;color:#44506b;list-style:disc}
.pano .pbody{padding:2px 12px 10px}
.locator{background:#eef3fa;border:1px solid #d5e2f2;border-radius:10px;padding:8px 11px;font-size:13px;color:#33507c;margin-bottom:10px}
.lecsec{margin:12px 0}
.lecsec h4{font-size:15px;color:#1c5fc2;margin-bottom:4px}
.lecsec p{font-size:14.5px;line-height:1.75}
.exbox{background:#f6fbf3;border:1px solid #cfe6c3;border-radius:12px;padding:11px 13px;margin:12px 0}
.exbox b{color:#39702a}
.trapbox{background:#fff7f2;border:1px solid #f3d3bd;border-radius:12px;padding:11px 13px;margin:12px 0}
.trapbox b{color:#b3541e}
.trapbox li,.exbox li{margin-left:18px;font-size:14px;line-height:1.7}
.mmap{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:10px 0;background:#fff}
.mmap .mmroot{font-weight:800;font-size:15px;text-align:center;background:#1c5fc2;color:#fff;border-radius:9px;padding:7px 8px}
.mmap .mmkids{display:flex;flex-direction:column;gap:8px;margin-top:9px}
.mmap .mmbr{border:1px solid #d5e2f2;border-left:4px solid #1c5fc2;border-radius:9px;padding:7px 10px;background:#fbfcfe}
.mmap .mmbr b{font-size:14px}
.mmap .mmleaf{display:inline-block;background:#eef3fa;border-radius:7px;padding:2px 8px;font-size:12.5px;margin:4px 4px 0 0;color:#33507c}
.unitnav{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
.uvid{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:#fbfcfe}
.uvidt{font-weight:700;font-size:14px;margin-bottom:6px}
.uvid .btn{margin:2px 2px 2px 0}
.epsdir{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff}
.epsdir summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none}
.epsdir summary::-webkit-details-marker{display:none}
.epslist{padding:2px 12px 12px;display:flex;flex-direction:column;gap:6px}
.epbtn{text-align:left;background:#eef3fa;border:1px solid #d5e2f2;border-radius:9px;padding:8px 10px;font-size:13.5px;cursor:pointer}
.anchorbox{background:#fff7e0;border:1px solid #ecd28a;border-radius:12px;padding:11px 13px;margin:12px 0;font-size:13px;color:#7a5b12}
.anchorbox b{font-size:16.5px;color:#5c430a;line-height:1.6}
.anchorbox.light{background:#fbfcfe;border-color:var(--line);color:#44506b;font-size:14px}
.anchorbox.light b{font-size:14.5px;color:#1c5fc2}
.pt{margin:10px 0;padding-left:10px;border-left:3px solid #d5e2f2}
.pt .pth{font-weight:800;font-size:15px;color:#16324f;margin-bottom:2px}
.pt p{font-size:14.5px;line-height:1.7}
.pt p b,.exbox b,.trapbox li b{color:#b3541e}
.samplnote{border-color:#ffd9c2;background:#fff8f3}

</style>
</head>
<body>
<header>
  <h1>教资备考工作台 · 音乐</h1>
  <div class="sub">今天只做一件事，学完打勾，没学完自动顺延。</div>
  <div class="tracks" id="tracks"></div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-v="today" class="on">今日</button>
  <button data-v="guide">导览</button>
  <button data-v="course">课程</button>
  <button data-v="quiz">刷题</button>
  <button data-v="wrong">错题本</button>
  <button data-v="me">我的</button>
</nav>
<script>
/* ============ 内容数据包（换考试只需替换 PACK） ============ */
/* 科目一：综合素质（中学）— 初中/高中共享 */
const K1 = {name:"科目一 · 综合素质", units:[
{id:"k1a",t:"职业理念：教育观与素质教育",min:25,pts:["素质教育内涵：面向全体、全面发展、促进个性发展、培养创新精神与实践能力。","新课改教育观：学生是发展的人、用发展的眼光看学生。","考法：材料分析题高频，先表态再分点引用观点。"],qs:[
{q:"素质教育的内涵不包括下列哪一项？",opts:["面向全体学生","促进学生个性发展","以提高升学率为根本目的","培养创新精神和实践能力"],a:2,why:"素质教育以育人为本，提高升学率不是其目的。"},
{q:"“每个学生都是独特的、发展中的人”，体现的是哪种学生观？",opts:["学生是被动接受的对象","学生是发展的人、独特的人","学生只是知识的容器","学生与成人完全相同"],a:1,why:"新课改学生观：学生是发展的人、独特的人、具有独立意义的人。"}]},
{id:"k1b",t:"职业理念：学生观与教师观",min:20,pts:["教师观：教师是学生学习的促进者、教育教学的研究者、课程的建设者和开发者。","师生关系：民主平等、教学相长、心理相容。","育人为本是教育的根本要求。"],qs:[
{q:"下列哪项不属于新课改倡导的教师角色？",opts:["学生学习的促进者","课程的建设者和开发者","知识的唯一权威与灌输者","教育教学的研究者"],a:2,why:"新课改反对教师中心与知识灌输。"},
{q:"“教学相长”主要强调师生关系中的哪一点？",opts:["教师单向输出","师生共同成长、民主平等","学生服从教师","教师回避学生提问"],a:1,why:"教学相长指教师与学生在教学中相互促进、共同提高。"}]},
{id:"k1c",t:"教育法律法规（上）：权利与义务",min:30,pts:["《教育法》是教育根本法；《教师法》规定教师权利义务与资格制度。","教师权利：教育教学权、科学研究权、指导评价权、获取报酬权、民主管理权、进修培训权。","学生主要权利：受教育权、人身权（生命健康、人格尊严、隐私）、财产权。"],qs:[
{q:"教师对学生的中考成绩进行排名公布，侵犯了学生的哪项权利？",opts:["财产权","隐私权","受教育权","休息权"],a:1,why:"成绩属于个人隐私，未经允许公布侵犯隐私权。"},
{q:"下列哪项不属于教师的法定权利？",opts:["开展教育教学活动","按时获取工资报酬","体罚不听话的学生","参加进修培训"],a:2,why:"教师不得体罚学生，这是法律明文禁止的。"}]},
{id:"k1d",t:"教育法律法规（下）：责任与救济",min:30,pts:["《未成年人保护法》：家庭、学校、社会、网络、政府、司法六大保护。","《预防未成年人犯罪法》《学生伤害事故处理办法》是案例题常客。","教师违法责任：行政处分、行政处罚、刑事责任、民事责任要分清。"],qs:[
{q:"学校发现未成年学生遭受侵害，应当优先采取的措施是？",opts:["先内部通报批评","立即向公安机关报案并保护学生","等待家长处理","息事宁人避免影响声誉"],a:1,why:"学校有强制报告义务，应立即报案并保护未成年人。"},
{q:"教师因失职造成学生伤害事故，学校与教师分别承担何种责任？",opts:["都无责任","学校承担赔偿责任，教师可能受行政处分","只由教师个人承担全部责任","只由学生家长承担"],a:1,why:"职务行为由学校对外担责，教师另受处分或追偿。"}]},
{id:"k1e",t:"教师职业道德规范",min:20,pts:["六条：爱国守法、爱岗敬业、关爱学生、教书育人、为人师表、终身学习。","关爱学生：严禁体罚与变相体罚、讽刺挖苦。","为人师表：坚守高尚情操、自觉抵制有偿家教是常考点。"],qs:[
{q:"“关爱学生”在职业道德规范中要求教师做到？",opts:["只关心成绩好的学生","关心爱护全体学生，公平对待每一名学生","用惩罚代替教育","对学生差别对待"],a:1,why:"关爱学生要求面向全体、公平公正。"},
{q:"教师利用节假日进行有偿补课收费，违反了哪条规范？",opts:["爱国守法","为人师表","终身学习","爱岗敬业"],a:1,why:"自觉抵制有偿家教属于为人师表的要求。"}]},
{id:"k1f",t:"文化素养：中国传统文化与历史",min:30,pts:["抓大放小：先秦诸子、唐宋文学、四大发明、重要史事的时间线。","传统节日与习俗、二十四节气、姓氏称谓等生活化考点。","复习法：按朝代拉一条线，人物作品对位记忆。"],qs:[
{q:"“四书”指的是？",opts:["《诗》《书》《礼》《易》","《大学》《中庸》《论语》《孟子》","《史记》《汉书》《后汉书》《三国志》","《文心雕龙》《诗品》《人间词话》《沧浪诗话》"],a:1,why:"四书为《大学》《中庸》《论语》《孟子》。"},
{q:"活字印刷术的发明者是？",opts:["蔡伦","张衡","毕昇","沈括"],a:2,why:"北宋毕昇发明活字印刷术；蔡伦改进造纸术。"}]},
{id:"k1g",t:"文化素养：文学艺术与科学常识",min:30,pts:["外国文学：莎士比亚、雨果、托尔斯泰等代表作对位。","艺术常识：绘画流派、著名乐曲与乐器（与音乐专业重叠部分优先拿下）。","科学常识：物理化学天文的基础概念题，重在排除法。"],qs:[
{q:"《命运交响曲》的作者是？",opts:["莫扎特","贝多芬","巴赫","肖邦"],a:1,why:"贝多芬第五交响曲《命运》。"},
{q:"印象派绘画的代表人物是？",opts:["达·芬奇","莫奈","毕加索","梵高只画星月夜属后印象派不在此列"],a:1,why:"莫奈是印象派代表；梵高属后印象派。"}]},
{id:"k1h",t:"基本能力：阅读理解",min:25,pts:["先看题再读文：主旨题找中心句，细节题回原文定位。","材料多为教育类文本，注意作者态度词。","限时训练：单篇控制在 8 分钟内。"],qs:[
{q:"阅读理解中“这段文字主要说明了”类题目，应优先抓取？",opts:["生词释义","段落中心句与作者观点","举例细节","修辞手法"],a:1,why:"主旨题抓中心句与观点句。"},
{q:"遇到指代题“这指的是”，正确做法是？",opts:["只看本句","往前文找最近的对应内容","凭常识猜测","跳过不答"],a:1,why:"指代内容一般在指代词前文就近出现。"}]},
{id:"k1i",t:"基本能力：逻辑思维",min:25,pts:["常考：直言命题、假言命题（充分必要条件）、朴素推理。","翻译规则：前推后、逆否等价，是逻辑题的命门。","图形与数字推理靠题型套路，多练即稳。"],qs:[
{q:"“只有报名，才能参加考试”等价于？",opts:["报名→参加考试","参加考试→报名","不报名→能参加考试","报名与考试无关"],a:1,why:"“只有P才Q”翻译为 Q→P：参加考试→报名。"},
{q:"“所有获奖者都是学生”的矛盾命题是？",opts:["所有获奖者都不是学生","有的获奖者不是学生","有的获奖者是学生","没有获奖者"],a:1,why:"全称肯定命题的矛盾命题是特称否定命题。"}]},
{id:"k1j",t:"基本能力：信息处理",min:20,pts:["Word/Excel/PPT 基础操作概念：格式刷、单元格引用、筛选排序。","多媒体与网络常识：文件格式、搜索引擎技巧。","这类题靠记忆清单，考前一周集中过一遍。"],qs:[
{q:"在 Excel 中，公式里 $A$1 表示？",opts:["相对引用","绝对引用","货币格式","错误值"],a:1,why:"$ 符号锁定行列，为绝对引用。"},

/* ============ 机制层（与内容包分离，可复刻到其他考试） ============ */
const LS_KEY = "jiaozhi_workbench_v1";
let MEM = null;
function lsGet(){ try{ return localStorage.getItem(LS_KEY); }catch(e){ return MEM; } }
function lsSet(v){ MEM = v; try{ localStorage.setItem(LS_KEY, v); }catch(e){} }
let S = load();
function load(){ try{ const s = JSON.parse(lsGet()); if(s && s.track) return s; }catch(e){} return {track:"junior", view:"today", done:{}, wrong:[], weekly:300, openUid:null, res:[]}; }
function save(){ lsSet(JSON.stringify(S)); }
function weekKey(d){ d = d||new Date(); const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = (dt.getUTCDay()+6)%7; dt.setUTCDate(dt.getUTCDate()-day+3); const firstThu = new Date(Date.UTC(dt.getUTCFullYear(),0,4)); const fday = (firstThu.getUTCDay()+6)%7; firstThu.setUTCDate(firstThu.getUTCDate()-fday+3); return dt.getUTCFullYear()+"W"+String(1+Math.round((dt-firstThu)/(7*864e5))).padStart(2,"0"); }
function trackUnits(tid){ const out=[]; PACK.tracks[tid].subjects.forEach(sj=>sj.units.forEach(u=>out.push({sj:sj.name,u}))); return out; }
function findUnit(tid,uid){ for(const sj of PACK.tracks[tid].subjects){ for(const u of sj.units){ if(u.id===uid) return {sj:sj.name,u}; } } return null; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function daysToExam(){ const now = new Date(); now.setHours(0,0,0,0); return Math.round((new Date(EXAM_DATE+"T00:00:00")-now)/864e5); }
function weekMinutes(tid){ const wk = weekKey(); let m=0; trackUnits(tid).forEach(({u})=>{ if(S.done[u.id]===wk) m+=u.min; }); return m; }
function totalProgress(tid){ const us = trackUnits(tid); const d = us.filter(({u})=>S.done[u.id]).length; return {d, n:us.length, pct: us.length? Math.round(d/us.length*100):0}; }

function renderTracks(){ const el = document.getElementById("tracks"); el.innerHTML = Object.keys(PACK.tracks).map(k=>'<button data-t="'+k+'" class="'+(S.track===k?"on":"")+'">'+PACK.tracks[k].label+'</button>').join(""); el.querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.track=b.dataset.t; S.openUid=null; save(); render(); }); }
function renderNav(){ document.querySelectorAll("#nav button").forEach(b=>{ b.classList.toggle("on", b.dataset.v===S.view); b.onclick=()=>{ S.view=b.dataset.v; save(); render(); }; }); }

 ex:{t:"材料：王老师业余时间在自家开补习班，只招本班学生并收费，称「家长自愿，不算违规」。拆解：先表态——违背职业道德。回扣*为人师表*：教师应自觉抵制有偿家教，「家长自愿」不改变有偿补课的性质；且只招本班学生，易滋生课堂留一手。排除干扰：这与「关爱学生」无关，别错位引用。收尾：应停止收费补课，把精力放回课堂教学。"},
 traps:["关爱学生≠溺爱学生：差别在原则——严慈相济，不是无底线迁就。","爱岗敬业≠拼命加班：差别在内涵——讲忠诚履职，不是比谁耗时间长。","有偿家教≠无偿辅导：差别在收费——收了钱、招本班生就是红线。"]},

k1f:{ pos:"在地图上的位置：导览第 2 站 · 科目一学法 › 文化素养｜全景图：科目一 › 文化素养 › 本单元",
 meta:"考频 ★★★☆☆｜考法：选择题（9 题量级）｜预计 30 分钟",
 anchor:"一条时间线串到底：诸子、经典、节日、发明对位记",
 map:{t:"传统文化（一张图看懂）", kids:[
   {t:"先秦诸子：人物对主张", kids:["孔子：仁、为政以德","孟子：性善、民贵君轻","老子：道法自然、无为","庄子：逍遥齐物","墨子：兼爱非攻","韩非：以法治国"]},
   {t:"典籍与常识：抓大放小", kids:["四书：《大学》《中庸》《论语》《孟子》","五经：诗、书、礼、易、春秋","四大发明：造纸、印刷、火药、指南针"]},
   {t:"生活常识：节日节气", kids:["传统节日与习俗对位","二十四节气按季节排","干支纪年与生肖（了解）"]}]},
 points:[
  {h:"诸子对位：一人一主张", t:"先秦题就是*人物对主张*：孔子仁、孟子性善民本、老子无为、庄子逍遥、墨子*兼爱非攻*、韩非法治。对上号，一半题已解。"},
  {h:"儒家两巨头别混", t:"孔子讲*仁与礼*，孟子讲*性善与仁政*；荀子讲*性恶*、主张隆礼重法。题目出现「人之初性本善」选孟子，「化性起伪」选荀子。"},
  {h:"四书五经：清单记牢", t:"*四书*是《大学》《中庸》《论语》《孟子》；*五经*是诗、书、礼、易、春秋。《史记》是史书，不在经里，别被混选。"},
  {h:"四大发明：顺序有讲究", t:"造纸（蔡伦改进）、印刷（雕版到活字）、火药、*指南针*；问「传入欧洲影响最大」类题，多与航海和指南针相连。细节拿不准，抓大方向。"},
  {h:"节日习俗：场景对位", t:"重阳登高敬老、端午赛龙舟吃粽子、中秋赏月、清明扫墓踏青——用*场景词*反推节日，比死背日期稳。"},
  {h:"复习法：拉一条时间线", t:"文化素养拼的是*广度*：按朝代拉线，人物、作品、事件挂在线上，每天过一小段；单点硬背最容易忘，也最容易张冠李戴。"}],
 ex:{t:"题目：「兼爱、非攻、尚贤、节用」是哪家的主张？拆解：关键词*兼爱非攻*直指*墨家*（墨子）。排除最像的儒家：儒家讲「爱有差等」，与兼爱的无差别之爱正相反；法家讲法术势，道家讲无为，都对不上这组词。做这类题抓一两个标志词即可定家。"},
 traps:["性善≠性恶：差别在人物——孟子主性善，荀子主性恶。","四书≠五经：差别在构成——四书多理学经典，五经是儒家元典。","兼爱≠仁爱：差别在范围——兼爱无差等，仁爱有差等。"]},

k1g:{ pos:"在地图上的位置：导览第 2 站 · 科目一学法 › 文化素养｜全景图：科目一 › 文化素养 › 本单元",

 map:{t:"文学艺术科学（一张图看懂）", kids:[
   {t:"文学：作品对作者", kids:["中国：唐诗宋词元曲明清小说一条线","外国：莎士比亚、雨果、托尔斯泰等名家名作"]},
   {t:"艺术：流派对代表", kids:["绘画：达·芬奇、梵高、莫奈（印象派）","音乐：巴赫、贝多芬、莫扎特分工明确"]},
   {t:"科学：成就对人物", kids:["哥白尼日心说、达尔文进化论","牛顿力学、爱因斯坦相对论（对位即可）"]}]},
 points:[
  {h:"文学题：标志作定人", t:"记*代表作*比记生平管用：《哈姆雷特》莎士比亚、《悲惨世界》雨果、《战争与和平》托尔斯泰。看到作品名，人基本就定了。"},
  {h:"中国文学：体裁配朝代", t:"诗唐、词宋、曲元、小说明清是粗线；再挂几个尖子：李杜苏辛、关汉卿、《红楼梦》曹雪芹。题干给体裁，先*锁朝代*再选人。"},
  {h:"绘画：流派认脸", t:"达·芬奇是*文艺复兴*全才（《蒙娜丽莎》），莫奈是*印象派*（《日出·印象》），梵高是后印象派（《向日葵》）。流派与人双向对位。"},
  {h:"音乐：三人别混岗", t:"巴赫是*巴洛克*「音乐之父」，莫扎特是古典主义神童，贝多芬承前启后、《命运》作者。本专业是加分项，先把这块拿稳。"},
  {h:"科学题：成就对人", t:"*日心说*哥白尼、*进化论*达尔文、*万有引力与相对论*牛顿、爱因斯坦。不考推导，只考对位，排除法足够。"},
  {h:"常识题打法：先排离谱项", t:"文化素养单题分低、范围无边：*不恋战*，先排除年代或国籍明显错的选项，拿不准就按第一印象走，把时间留给作文。"}],
 ex:{t:"题目：下列作品与作者对应正确的是？选项含「《日出·印象》—梵高」。拆解：《日出·印象》是*莫奈*的作品、印象派因此得名，故该项错误。排除逻辑：梵高的标志作是《向日葵》《星月夜》，画家与标志作对不上即排。这类题逐项用标志作验一遍，比通读四项更快。"},
 traps:["莫奈≠梵高：差别在流派——莫奈是印象派，梵高是后印象派。","巴赫≠贝多芬：差别在时代——巴赫巴洛克，贝多芬古典后期。","日心说≠进化论：差别在对象——前者讲天体，后者讲物种起源。"]},

k1h:{ pos:"在地图上的位置：导览第 2 站 · 科目一学法 › 基本能力｜全景图：科目一 › 基本能力 › 本单元",
 meta:"考频 ★★★★☆｜考法：阅读理解大题（1 题）｜预计 25 分钟",
 anchor:"先看题再读文，主旨抓中心句，细节回原文",
 map:{t:"阅读理解（一张图看懂）", kids:[
   {t:"题型就三类", kids:["主旨题：主要说明、意在表达","细节题：下列说法正确/不正确","词句题：划线词句的含义"]},
   {t:"做题顺序：题文题", kids:["先看题干与选项，带着问题读","边读边圈中心句与态度词","选项回原文逐项核对"]},
   {t:"文体提示：多为散文随笔", kids:["抓议论抒情句","例子是论据，不是观点"]}]},
 points:[
  {h:"主旨题：找中心句", t:"问「主要说明/意在表达」，答案在*中心句*里：多在首尾段、转折之后。以偏概全的选项（只讲某个例子）先排掉。"},
  {h:"细节题：回原文对账", t:"「下列说法正确/不正确」必须*回原文定位*逐项核对，警惕偷换概念、无中生有、范围扩大三类陷阱，不凭印象选。"},
  {h:"词句题：结合上下文", t:"划线词句的含义不能只看字面：联系*上下文语境*，问「指什么」选指代内容，问「作用」选与主旨的关联。"},
  {h:"态度题：盯评价词", t:"作者态度藏在*褒贬词与转折句*里：先肯定后「但是」的，态度在但是之后；通篇中立介绍的，别硬安上批判。"},
  {h:"例子不是观点", t:"长例子、故事段落都是*论据*：选项若把例子的情节当全文主旨，就是以偏概全，这是主旨题最常见的坑。"},
  {h:"限时：单篇有预算", t:"阅读就 1 题但分不低：通读加作答*控制在 10 分钟上下*，卡住先标记跳过，别让它吃掉作文时间。"}],
 ex:{t:"题目设问：「这段文字主要说明了」某教师以留白方式处理课堂提问。四个选项中一项说「留白能提高课堂提问的艺术」，三项分别复述文中某个课堂片段。拆解：复述片段的都是*以偏概全*，先排；主旨要覆盖全文的*中心观点*，选概括留白价值的那项。排除要点：凡是只对应某一段、某一个例子的选项，都撑不起「主要说明」。"},
 traps:["主旨≠细节：差别在覆盖面——主旨管全文，细节只管一处。","例子≠观点：差别在功能——例子是论据，观点才是作者主张。","态度≠事实：差别在来源——态度看评价词，事实看原文陈述。"]},

k1i:{ pos:"在地图上的位置：导览第 2 站 · 科目一学法 › 基本能力｜全景图：科目一 › 基本能力 › 本单元",
 meta:"考频 ★★★☆☆｜考法：选择题｜预计 25 分钟",
 anchor:"前推后、逆否等价：逻辑题先翻译再推理",
 map:{t:"逻辑思维（一张图看懂）", kids:[
   {t:"假言命题：命门所在", kids:["如果A那么B：A→B（前推后）","只有B才A：A→B（后件是必要条件）","逆否命题：非B→非A，与原命题等价"]},
   {t:"其他命题：认关键词", kids:["联言：且，两边都要真","选言：或，至少一个真","直言：所有、有的（对当关系了解即可）"]},
   {t:"朴素推理：代入排除", kids:["条件多：列表或假设法","图推：数数量、看位置、找对称"]}]},
 points:[
  {h:"先翻译：箭头定生死", t:"逻辑题第一步永远是*翻译*：「如果 A 就 B」写成 *A→B*；箭头方向错，后面全错。先写符号，再动脑。"},
  {h:"只有才：后件在前件后", t:"「只有 B，才 A」里 B 是*必要条件*，翻译仍是 *A→B*。这是最爱考的坑：别顺着语序写成 B→A。"},
  {h:"逆否等价：唯一等价", t:"原命题与*逆否命题*等价：A→B 等价于 非B→非A。否前件、肯后件都推不出结论，选项里出现这类推理直接排。"},
  {h:"且与或：真假看构成", t:"*联言*（且）全真才真；*选言*（或）有真即真、全假才假。题目问「一定假」，先找全假或全真的组合。"},
  {h:"直言命题：所有与有的", t:"「所有」与「有的不」是*矛盾关系*：一个真另一个必假。考场只考这一层对当关系，别在方阵图里耗时间。"},
  {h:"朴素推理：代入最快", t:"条件杂乱时用*代入排除法*：拿选项逐个回条件验；图形推理先数数量、再看对称与位置规律，别凭感觉猜。"}],
 ex:{t:"题目：「只有通过面试，才能入职」为真，则一定为真的是？拆解：先翻译——入职→通过面试（面试是*必要条件*）。逐项验：说「通过面试就能入职」是肯后件推前件，无效；说「没通过面试就不能入职」是*逆否命题*，等价，成立。排除关键：凡把必要条件当充分条件用的选项，无论说得多顺都是错的。"},
 traps:["充分≠必要：差别在位置——箭头前是充分，箭头后是必要。","逆否≠否命题：差别在操作——逆否要既换位又加否，只加否不等价。","或≠且：差别在门槛——或有一真即真，且要全真才真。"]},

k1j:{ pos:"在地图上的位置：导览第 2 站 · 科目一学法 › 基本能力｜全景图：科目一 › 基本能力 › 本单元",
 meta:"考频 ★★☆☆☆｜考法：选择题｜预计 20 分钟",
 anchor:"格式刷复制格式，$锁引用，筛选先选区",
 map:{t:"信息处理（一张图看懂）", kids:[
   {t:"Word：编辑三件事", kids:["格式刷：刷格式不刷内容","查找替换：批量改词","分栏、页眉页脚：版式类概念"]},
   {t:"Excel：引用与函数", kids:["相对引用：随位置变","绝对引用：$A$1 锁行列","常用函数：SUM、AVERAGE、MAX"]},
   {t:"常识包：格式与单位", kids:["图片 jpg/png、音频 mp3、视频 mp4","存储换算：1GB=1024MB","PPT 母版：统一版式与背景"]}]},
 points:[
  {h:"格式刷：只刷格式", t:"Word 里*格式刷*复制的是字体、段落等*格式*，不复制文字内容；双击格式刷可连续刷多次，这是最爱考的小区别。"},
  {h:"绝对引用：认准美元符", t:"Excel 公式里 *$A$1* 是*绝对引用*，拖动填充时行列都不变；没有 $ 的是相对引用，会随位置自动变。"},
  {h:"函数三件套先记牢", t:"求和 *SUM*、平均 *AVERAGE*、最大 *MAX*；函数以等号开头写在单元格里。选项里把函数名与功能错位的，直接排。"},
  {h:"筛选排序：先选数据区", t:"做筛选、排序前要*选中数据区域*或点在数据内；只选一列排序会把行对应关系打乱，这是操作题的常设陷阱。"},
  {h:"文件格式：按类对位", t:"图片 jpg/png、音频 *mp3*、视频 *mp4*、文档 docx/xlsx/pptx 看后缀辨类；题目给场景选格式，先按多媒体类型分类。"},
  {h:"存储单位：1024 进位", t:"计算机存储按 *1024* 进位：1GB=1024MB、1MB=1024KB。与日常十进制不同，这是本单元最稳的一道送分题。"}],
 ex:{t:"题目：在 Excel 中把公式从 C1 复制到 C5，希望引用的 A1 始终不变，应把公式里的 A1 写成？拆解：要求拖动时*行列都不变*，对应*绝对引用*，写成 *$A$1*。排除最像的 $A1 与 A$1：那是混合引用，只锁一头，拖动时另一头仍会变。抓题眼：题干说「始终不变」，就选两道锁都上的。"},
 traps:["格式刷≠复制：差别在对象——刷的是格式，复制的是内容加格式。","相对引用≠绝对引用：差别在美元符——有 $ 锁定，无 $ 随动。","筛选≠排序：差别在结果——筛选是隐藏不符合的，排序是重排顺序。"]},

k1k:{ pos:"在地图上的位置：导览第 2 站 · 科目一学法 › 基本能力（写作）｜全景图：科目一 › 基本能力 › 本单元",
 meta:"考频 ★★★★★｜考法：写作题（50 分）｜预计 40 分钟",
 anchor:"五段成文：点题、举例、析理、联系、收束",
 map:{t:"写作（一张图看懂）", kids:[
   {t:"结构：五段式模板", kids:["开头：引材料＋亮论点","主体三段：分论点＋事例＋析理","结尾：联系教育＋升华收束"]},
   {t:"素材库：自备六个", kids:["正面：坚守、创新、关爱各一","反面：急功近利、放弃学生各一","用法：一个素材多角度切"]},
   {t:"考场纪律：时间与字数", kids:["留约 45 分钟","中学卷约 1000 字","卷面分段清晰、不涂改成团"]}]},
 points:[
  {h:"立意：先扣材料再扣教育", t:"读材料先抓*关键词与倾向*，论点一句话说清；再往*教育、教师、成长*上落。跑题是作文最大的丢分，先花两分钟定题再动笔。"},
  {h:"标题：短、明、有文采边", t:"标题直接亮观点，如「守望初心，静待花开」式*对仗短语*；拿不准就用「论＋主题词」的稳妥式，别用问句和口号凑数。"},
  {h:"开头：三句成段", t:"模板：引材料一句、析意一句、*亮论点*一句。开头不绕弯、不抄大段材料，阅卷人十几秒就要看到你的立场。"},
  {h:"主体：段段有例子和分析", t:"每段结构固定：*分论点＋事例＋一句析理*。只摆事例不分析，等于没论证；事例用素材库里的，不临场编造细节。"},
  {h:"素材：六个万能件", t:"自备*正反六个*人物事例，覆盖坚守、创新、关爱、功利、放弃、成长；一个素材练会*多角度切入*，比背几十个生素材更顶用。"},
  {h:"结尾：回扣加升华", t:"结尾先*回扣论点*，再联系教师身份升华一句，最后收束全文。不在结尾提新论点，不写「综上所述」式的空话套话。"},
  {h:"纪律：时间字数卷面", t:"全程留约*45 分钟*、写满约*1000 字*；分段清楚、少涂改。写不完比写得浅更致命，宁可提前收尾也不能烂尾。"}],

  {h:"环节五步：备课打头", t:"教学工作五环节：*备课*是前提（备教材、备学生、备方法）、*上课*是中心环节、作业布置与批改、课外辅导、学业成绩的检查与评定。"},
  {h:"班级授课：基本形式", t:"*班级授课制*是教学的基本组织形式，由夸美纽斯系统论述：同龄编班、按课表上课、全班同一进度。优点是*效率高*，短板是难照顾差异。"},
  {h:"分组个别：补差异", t:"*分组教学*按能力或兴趣把学生分组施教；*个别教学*一人一案；新课改的*选课走班*也是变式。它们补的正是班级授课难因材施教的短板。"},
  {h:"评价看时机：三段", t:"*诊断性评价*在教学前摸底；*形成性评价*在教学中进行、为了改进；*终结性评价*在一阶段结束后评定结果。认法只看它发生在什么时候。"},
  {h:"评价看参照：三标", t:"*绝对评价*比预定标准，*相对评价*比同伴水平，*个体内差异评价*比学生自己的过去与现在。参照物是谁，评价名就是谁。"}],
 ex:{t:"例题：「新学期开学第一周，教师对全班做了一次摸底测验，以便了解学情、安排教学。这属于哪种评价？」答案是诊断性评价。排除逻辑：它发生在教学开始之前、目的在摸清起点，排除在过程中进行的形成性评价与在结束时评定的终结性评价。"},
 traps:["形成性≠终结性：差别在时机——形成性在过程中为改进，终结性在结束后做评定。","相对评价≠绝对评价：差别在参照——相对比同伴水平，绝对比预定标准。","班级授课≠分组教学：差别在编排——同班同进度是班级授课，按能力分组是分组教学。"]},

k2g:{ pos:"在地图上的位置：导览第 3 站 · 科目二知识地图 › 主干「发展心理」｜全景图：科目二 › 中学生发展心理 › 本单元",
 meta:"考频 ★★★★｜考法：选择题大户、皮亚杰与埃里克森可出简答｜预计 25 分钟",
 anchor:"皮亚杰四阶看认知，埃里克森看任务，中学核心是同一性",
 map:{t:"中学生发展心理（一张图看懂）", kids:[
   {t:"皮亚杰：认知四阶段", kids:["感知运动（0–2）：客体永恒性","前运算（2–7）：自我中心、不可逆","具体运算（7–11）：守恒、可逆","形式运算（11 起）：抽象与假设"]},
   {t:"维果茨基：教学走在前面", kids:["最近发展区：现有与潜在水平之差","教学应走在发展的前面"]},
   {t:"埃里克森：阶段任务", kids:["小学：勤奋感对自卑感","中学：自我同一性对角色混乱"]},
   {t:"青春期：矛盾并存", kids:["独立性与依赖性、闭锁性与开放性","情绪强烈两极、成人感与半成熟"]}]},
 points:[
  {h:"皮亚杰上：前两阶", t:"*感知运动阶段*（0–2 岁）靠动作认识世界，里程碑是*客体永恒性*；*前运算阶段*（2–7 岁）思维不可逆、以自我为中心、有泛灵论。"},
  {h:"皮亚杰下：后两阶", t:"*具体运算阶段*（7–11 岁）获得*守恒*与可逆，但离不开具体事物；*形式运算阶段*（11 岁起）能抽象推理、提假设——中学生的主战场。"},
  {h:"维果茨基：差一步", t:"*最近发展区*是现有水平与潜在水平之间的距离。教学启示：目标要定在学生*跳一跳够得着*的地方，教学走在发展前面。"},
  {h:"埃里克森：抓两段", t:"八阶段只先钉两段：小学是*勤奋感对自卑感*，中学是*自我同一性对角色混乱*。同一性回答的是“我是谁、我要成为谁”。"},
  {h:"青春期身心：半成熟", t:"生理上接近成人，心理上*成人感与半成熟感*并存：觉得自己是大人了，行事却还冲动。这是许多师生冲突的根源。"},
  {h:"青春期矛盾：两对半", t:"心理矛盾记两对：*独立性与依赖性*（想独立又离不开）、*闭锁性与开放性*（心里锁门又渴望倾诉）。教育对策是理解、疏导而非压制。"}],
 ex:{t:"例题：「把同样多的水从矮胖杯倒入细长杯，7 岁的小明说细长杯里水变多了。这说明他处于哪个阶段？」答案是前运算阶段。排除逻辑：他尚未获得守恒、思维不可逆，排除已掌握守恒的具体运算阶段；年龄与表现都对得上前运算。"},
 traps:["前运算≠具体运算：差别在守恒——前运算未获守恒、思维不可逆，具体运算已获守恒。","同一性≠勤奋感：差别在阶段——同一性是中学（青春期）的任务，勤奋感是小学的任务。","最近发展区≠现有水平：差别在定位——它指现有水平与潜在水平之间的那段距离。"]},

k2h:{ pos:"在地图上的位置：导览第 3 站 · 科目二知识地图 › 主干「心理辅导」｜全景图：科目二 › 中学生心理辅导 › 本单元",
 meta:"考频 ★★★｜考法：选择题为主、ABC 理论是材料题常客｜预计 20 分钟",
 anchor:"困扰不在事件在信念：ABC 抓 B，脱敏治焦虑",
 map:{t:"中学生心理辅导（一张图看懂）", kids:[
   {t:"先识貌：健康与问题", kids:["心理健康：认知、情绪、人格协调，适应良好","常见问题：焦虑、厌学、抑郁倾向、网络成瘾"]},
   {t:"理性情绪疗法：ABC", kids:["A 诱发事件、B 信念、C 情绪与行为结果","困扰源于非理性信念 B；与之辩论（D）求改变"]},
   {t:"方法对位：三条线", kids:["行为疗法：系统脱敏、强化、厌恶","来访者中心：真诚、共情、无条件积极关注","考试焦虑：认知调整加放松训练"]}]},
 points:[
  {h:"健康标准：协调适应", t:"心理健康看的是*认知、情绪、人格*协调与社会适应良好。判断学生问题要看*持续时间与功能损害*，偶尔的情绪波动不等于心理问题。"},
  {h:"常见问题：识貌版", t:"中学生高频四样：*焦虑*（考试焦虑最常见）、*厌学*、抑郁倾向、*网络成瘾*。辅导第一步是识别边界，不给学生乱贴标签。"},
  {h:"ABC 理论：困扰在 B", t:"埃利斯的*理性情绪疗法*：A 是诱发事件，B 是对事件的*信念*，C 是情绪与行为结果。造成困扰的不是事件本身，而是*非理性信念* B。"},
  {h:"治 B 之法：去辩论", t:"治疗动作是与非理性信念*辩论*，把它换成合理信念，情绪随之改变。简答骨架：找非理性信念—辩论质疑—建立新信念。"},
  {h:"行为疗法：脱敏打头", t:"*系统脱敏*治焦虑恐惧：先放松，再按*焦虑等级*由弱到强逐步面对刺激。厌恶疗法、强化法同属行为疗法，材料题里按机制认。"},
  {h:"来访者中心：靠关系", t:"罗杰斯的方法靠三件：*真诚*、*共情*、*无条件积极关注*。它不指导、不辩论，与理性情绪疗法“主动辩论”的风格正好相反。"},
  {h:"考试焦虑：三件套", t:"调节顺序：*认知调整*把预期放合理、*放松训练*降生理唤醒、必要时系统脱敏。辅导还要守*保密*原则，超出能力范围及时转介。"}],
 ex:{t:"例题：「学生小林一次月考失利后认定‘我彻底完了，以后肯定考不好’，整日焦虑。用 ABC 理论分析，问题出在哪？」答案是 B（信念）：一次失利是事件 A，“彻底完了”是把单次结果绝对化的非理性信念，它才是焦虑 C 的直接来源。排除逻辑：A 本身不直接决定情绪，决定情绪的是对 A 的看法。"},
 traps:["事件A≠情绪C的直接原因：差别在中介——中间隔着信念 B，C 由 B 决定。","系统脱敏≠厌恶疗法：差别在机制——脱敏用放松对抗焦虑，厌恶用不快刺激戒断行为。","共情≠同情：差别在立场——共情站在对方的框架里理解，同情站在外面可怜对方。"]},

k2i:{ pos:"在地图上的位置：导览第 3 站 · 科目二知识地图 › 主干「德育」｜全景图：科目二 › 中学德育 › 本单元",
 meta:"考频 ★★★★｜考法：选择题、材料分析题常客｜预计 25 分钟",
 anchor:"品德知情意行，过程多端反复，原则方法各就其位",
 map:{t:"中学德育（一张图看懂）", kids:[
   {t:"品德结构：四件套", kids:["道德认识（知）、道德情感（情）","道德意志（意）、道德行为（行）"]},
   {t:"发展理论：两条线", kids:["皮亚杰：他律到自律（对偶故事法）","科尔伯格：三水平六阶段（两难故事法）"]},
   {t:"德育过程：规律四条", kids:["多端性、长期性与反复性","积极因素克服消极因素","知情意行统一发展"]},
   {t:"原则与方法：清单对位", kids:["原则：导向、疏导、尊重与严格、知行统一、长善救失","方法：说服、榜样、锻炼、陶冶、修养、品德评价"]}]},
 points:[
  {h:"品德四件：知情意行", t:"品德由四部分构成：*道德认识*（知）、*道德情感*（情）、道德意志（意）、*道德行为*（行）。四者相互联系，德育可以从任一端入手。"},
  {h:"科尔伯格：三水平", t:"用两难故事法研究道德判断：*前习俗水平*看惩罚与利益，*习俗水平*看舆论与法律，*后习俗水平*看契约与普遍原则。认水平先认判断依据。"},
  {h:"皮亚杰：他律自律", t:"用*对偶故事法*看儿童道德：*他律阶段*服从权威、按结果定对错；*自律阶段*看动机、认为规则可以协商改变。"},
  {h:"过程规律：四条套", t:"德育过程规律成套记：*多端性*（可从知情意行任一端开端）、*长期性与反复性*、依靠*积极因素克服消极因素*、知情意行统一发展。"},
  {h:"原则上：方向五条", t:"先钉五条：*导向性*（方向第一）、疏导原则（循循善诱）、尊重学生与严格要求相结合、*知行统一*、*长善救失*（用优点克缺点）。"},
  {h:"原则下：对位补全", t:"补三条对位：*因材施教*看个体差异；*集体教育与个别教育相结合*（马卡连柯的平行教育）；教育*一致性与连贯性*防家校各说各话。"},
  {h:"方法六样：按手段认", t:"*说服法*靠讲理，*榜样法*靠示范，实际锻炼法靠实践，情感陶冶法靠环境，自我修养法靠自省，*品德评价法*靠奖惩。题干给手段，答案跟着走。"}],
 ex:{t:"例题：「面对‘该不该为救同伴而偷药’的两难故事，小刚说‘偷药不对，因为会被警察抓’。按科尔伯格理论，他处于哪个水平？」答案是前习俗水平。排除逻辑：他的判断依据是逃避惩罚，属于前习俗水平的第一阶段（惩罚与服从取向），尚未上升到舆论认可的习俗水平或原则层面的后习俗水平。"},
 traps:["他律≠自律：差别在标准——他律看结果与权威，自律看动机与规则可变。","疏导≠长善救失：差别在抓手——疏导重说服引导，长善救失重用优点克缺点。","榜样法≠品德评价法：差别在手段——榜样靠典型示范，评价靠奖惩与表扬批评。"]},

k2j:{ pos:"在地图上的位置：导览第 3 站 · 科目二知识地图 › 主干「班级管理」｜全景图：科目二 › 班级管理与教师心理 › 本单元",
 meta:"考频 ★★★｜考法：选择题为主、班集体与班主任可出简答｜预计 25 分钟",
 anchor:"先有班集体，再谈管理：了解是前提，组织是中心",
 map:{t:"班级管理与班主任工作（一张图看懂）", kids:[
   {t:"班集体：四个标志", kids:["共同的奋斗目标、健全的组织结构","共同的舆论、良好的人际关系"]},
   {t:"发展三阶段：靠谁管", kids:["初建阶段：依赖班主任","形成阶段：骨干与舆论初成","成熟阶段：学生自主管理"]},
   {t:"管理四模式", kids:["常规管理：靠制度","平行管理：借集体影响个人（马卡连科）","民主管理：学生参与；目标管理：定目标分解"]},
   {t:"班主任工作：位序分明", kids:["前提：了解和研究学生","中心环节：组织和培养班集体","日常：操行评定、班会、家访、协调"]}]},
 points:[
  {h:"班集体：四标志", t:"班集体不是“一个班”：要有*共同的奋斗目标*、健全的组织结构、共同的舆论与*良好的人际关系*。四标志齐全，才算成熟的集体。"},
  {h:"发展三阶：靠谁管", t:"*初建阶段*靠班主任立规矩；*形成阶段*班干部骨干出现、舆论初步形成；*成熟阶段*学生能自主管理。阶段题就看“管事的是谁”。"},
  {h:"模式四种：对位记", t:"*常规管理*靠规章制度；*平行管理*是班主任通过集体来影响个人（马卡连柯）；*民主管理*让学生参与决策；目标管理先定目标再分解落实。"},
  {h:"前提工作：了解学生", t:"*了解和研究学生*是班主任一切工作的前提：靠观察、谈话、查阅材料与调查访问。没有了解，后面的管理都是空中楼阁。"},
  {h:"中心环节：组织集体", t:"*组织和培养班集体*是班主任工作的中心环节：定共同目标、建班委机构、培养班风舆论——简答题问“中心环节”只答这一条。"},
  {h:"日常件：各就其位", t:"日常工作别混位：*操行评定*是学期评价、*主题班会*是集体教育、*家访*连家庭、还要协调任课教师与家长社会的关系。"}],
 ex:{t:"例题：「新接手的班级秩序混乱，班主任做的第一件事应当是什么？」答案是了解和研究学生。排除逻辑：组织班集体是中心环节、是目标动作，但大纲口径里它建立在了解学生的前提之上；不摸清学生情况就定目标建机构，顺序错位。"},
 traps:["班级≠班集体：差别在成熟度——有目标、机构、舆论与良好关系，才够格叫班集体。","平行管理≠民主管理：差别在主体——平行是借集体影响个人，民主是学生参与决策。","了解学生≠组织班集体：差别在定位——了解是前提，组织和培养是中心环节。"]},

k2k:{ pos:"在地图上的位置：导览第 3 站 · 科目二知识地图 › 主干「教师心理」｜全景图：科目二 › 班级管理与教师心理 › 本单元",
 meta:"考频 ★★｜考法：选择题为主｜预计 20 分钟",
 anchor:"成长三阶段看焦点，倦怠三维度看状态，期望能成真",
 map:{t:"教师心理与专业发展（一张图看懂）", kids:[
   {t:"成长三阶段：焦点在移", kids:["关注生存：能不能站稳讲台","关注情境：教学任务与成绩","关注学生：个体差异与需求"]},
   {t:"新手与专家：差别三处", kids:["课前计划：专家简洁灵活、新手详尽死板","课后评价：专家看学生反应、新手看自己表现"]},
   {t:"期望与倦怠：两个效应词", kids:["罗森塔尔效应：期望经传递影响学生","职业倦怠三维度：情绪衰竭、去人格化、低成就感"]}]},
 points:[
  {h:"成长三阶：福勒说", t:"教师关注点一路外移：*关注生存阶段*怕站不稳讲台，*关注情境阶段*盯教学任务与成绩，*关注学生阶段*才看个体差异与学习需求。"},
  {h:"专家画像：简洁灵活", t:"专家型教师的课前计划*简洁、灵活*，会预判学生反应；新手计划详尽却死板。课后评价也相反：专家看*学生学到了什么*，新手看自己讲得如何。"},
  {h:"期望效应：能自我实现", t:"*罗森塔尔效应*（又称皮格马利翁效应）：教师的期望通过态度与行为传递给学生，能促其按期望方向发展。正向期望是无声的教育资源。"},
  {h:"倦怠三维：认词眼", t:"职业倦怠三维度：*情绪衰竭*（没劲、耗竭）、*去人格化*（对学生冷漠疏离）、*低个人成就感*（觉得工作没价值）。材料题按词眼对号。"},
  {h:"倦怠从哪来：怎么调", t:"成因在*工作负荷、角色冲突、支持不足*；调适要双管：组织减负与支持，个人调整认知、保证休息。只喊“敬业”解决不了倦怠。"},
  {h:"教师心理：隐性课程", t:"教师的情绪与态度本身就是一门*隐性课程*：学生先感受到老师的状态，再听进老师的话。维护心理健康是专业发展的底盘。"}],
 ex:{t:"例题：「实习老师小王整天担心‘学生不喜欢我怎么办、课堂纪律能不能管住’，按福勒的理论，他处于哪个阶段？」答案是关注生存阶段。排除逻辑：他关注的是自己能否被接受、能否站稳，还没把焦点移到教学情境，更没到因材施教的学生层面。"},

  {h:"明清：昆曲到京剧", t:"*昆曲*经魏良辅改革成「水磨调」，唱腔细腻；*京剧*在清代形成，以*西皮、二黄*为主要声腔。题干出现「四大徽班进京」，指向京剧形成的背景。"},
  {h:"近现代一：学堂乐歌", t:"*沈心工、李叔同*是学堂乐歌的代表，多为依现成曲调填词、面向学校唱歌课；李叔同的*《送别》*是最常被引用的曲例。"},
  {h:"近现代二：救亡歌声", t:"*聂耳*作《义勇军进行曲》（田汉词）；*冼星海*作《黄河大合唱》（光未然词，1939 年）；延安的歌剧*《白毛女》*是新歌剧的代表作。三组对位别串人。"}],
 ex:{t:"选择题：下列作品与作者对应正确的是哪项？解：逐项对位——《黄河大合唱》冼星海作曲、《送别》李叔同填词、《二泉映月》华彦钧（阿炳）作曲，此项全对。最像的干扰项把《黄河大合唱》记到聂耳名下——聂耳的代表作是《义勇军进行曲》和《卖报歌》，故排除。"},
 traps:["聂耳≠冼星海：差别在作品——聂耳《义勇军进行曲》，冼星海《黄河大合唱》。","昆曲≠京剧：差别在声腔——昆曲用曲牌体水磨调，京剧用西皮二黄板腔体。","梨园≠教坊：差别在朝代——梨园属唐代，教坊多代有之别默认绑唐玄宗。"]},

 map:{t:"西方音乐史：四期时间轴（一张图看懂）", kids:[
   {t:"巴洛克（约 1600–1750）", kids:["巴赫：《平均律钢琴曲集》、赋格高手","亨德尔：清唱剧《弥赛亚》（《哈利路亚》）","维瓦尔第：小提琴协奏曲《四季》"]},
   {t:"古典主义（约 1750–1820）", kids:["海顿：「交响乐之父」，确立交响曲规范","莫扎特：歌剧《费加罗的婚礼》","贝多芬：九部交响曲，「乐圣」"]},
   {t:"浪漫主义（19 世纪）", kids:["舒伯特：「歌曲之王」，艺术歌曲《魔王》","肖邦：「钢琴诗人」，只写钢琴作品为主","柴可夫斯基：舞剧《天鹅湖》《胡桃夹子》"]},
   {t:"民族乐派与 20 世纪", kids:["斯美塔那：交响诗《沃尔塔瓦河》","德沃夏克：《新大陆交响曲》","德彪西：印象主义，《月光》"]}]},
 points:[
  {h:"巴洛克：巴赫与亨德尔", t:"*巴赫*以复调见长，《平均律钢琴曲集》被称作钢琴音乐的「旧约全书」；*亨德尔*的清唱剧*《弥赛亚》*中《哈利路亚》最著名。两人同为德国人、同年生。"},
  {h:"古典三杰：海莫贝", t:"*海顿*被称「交响乐之父」；*莫扎特*是天才型的全才，歌剧《费加罗的婚礼》是代表；*贝多芬*以九部交响曲把古典推到顶峰，又开启浪漫。"},
  {h:"奏鸣曲式：古典的骨", t:"古典交响曲第一乐章常用*奏鸣曲式*：呈示部—展开部—再现部。题目把「奏鸣曲式」和巴洛克对位法放一起考年代归属，记住骨在*古典期*成型。"},
  {h:"浪漫早期：歌曲与钢琴", t:"*舒伯特*把艺术歌曲推向高峰，称「歌曲之王」，作《魔王》《鳟鱼》；*肖邦*几乎只写钢琴作品，称「钢琴诗人」；李斯特首创单乐章的*交响诗*。"},
  {h:"浪漫晚期：歌剧与舞剧", t:"意大利*威尔第*与德国*瓦格纳*是歌剧双峰；俄国*柴可夫斯基*以舞剧《天鹅湖》《胡桃夹子》《睡美人》和《悲怆》交响曲立名，旋律性极强。"},
  {h:"民族乐派：写自己的河", t:"*斯美塔那*《我的祖国》中的《沃尔塔瓦河》写捷克的河；*德沃夏克*在美国写下《新大陆交响曲》。20 世纪的*德彪西*以印象主义《月光》另起一支。"}],
 ex:{t:"选择题：下列作曲家与称号对应错误的是哪项？解：逐个验——海顿「交响乐之父」对、舒伯特「歌曲之王」对、肖邦「钢琴诗人」对；把「乐圣」安给莫扎特错，*「乐圣」是贝多芬*，莫扎特常称「音乐神童」。最像的干扰是把巴赫称「音乐之父」——这一说法确实存在，不算错，故不选。"},
 traps:["巴赫≠亨德尔：差别在体裁招牌——巴赫看键盘与复调，亨德尔看清唱剧。","交响乐之父≠乐圣：差别在人——前者海顿，后者贝多芬。","交响诗≠交响曲：差别在乐章——交响诗是单乐章标题音乐，李斯特首创。"]},

 map:{t:"中国民族民间音乐：五大类（一张图看懂）", kids:[
   {t:"民歌：按场合分三类", kids:["号子：劳动时唱，一领众合","山歌：山野放声，高亢自由（如信天游、花儿）","小调：日常传唱，规整细腻（如《茉莉花》）"]},
   {t:"歌舞音乐：边舞边唱", kids:["秧歌（北方）、采茶（南方）、花灯","锣鼓伴奏，队形调度是看点"]},
   {t:"说唱音乐：说中带唱", kids:["京韵大鼓：鼓与弦书，刘宝全","苏州弹词：琵琶三弦自弹自唱","山东快书：说演结合"]},
   {t:"戏曲与器乐", kids:["昆曲、京剧：生旦净丑，唱念做打","江南丝竹、广东音乐、福建南音","独奏名曲：《十面埋伏》《二泉映月》"]}]},
 points:[
  {h:"五大类：先搭总架", t:"民族民间音乐分*民歌、歌舞音乐、说唱音乐、戏曲音乐、民族器乐*五类。选择题常拿「京韵大鼓」问归属——它说唱结合，归*说唱音乐*，不是戏曲。"},
  {h:"民歌三分：看使用场合", t:"*号子*配合劳动节奏，一领众合；*山歌*在山野田间放声而歌，节奏自由高亢；*小调*在日常生活里传唱，结构规整、旋律细腻。分类的尺是功能与场合。"},
  {h:"认曲例：给三类挂钩", t:"《茉莉花》是江苏*小调*；陕北*信天游*、西北*花儿*是山歌；船工、夯土时唱的《川江船夫号子》类是号子。曲例挂对类别，题就稳一半。"},
  {h:"说唱三样：各有招牌", t:"*京韵大鼓*以鼓板和三弦伴奏，刘宝全是代表人物；*苏州弹词*用琵琶、三弦自弹自唱；*山东快书*说表见长。考点是形式与人物的对位。"},
  {h:"器乐合奏：记三个地名", t:"*江南丝竹*乐器以丝竹为主、风格细腻；*广东音乐*以高胡领衔、明快流畅；*福建南音*历史悠久、节奏徐缓。题目多给风格描述让考生反推地名。"},
  {h:"独奏名曲：人与曲对位", t:"琵琶曲*《十面埋伏》*是武曲，写楚汉相争；二胡曲*《二泉映月》*是华彦钧（阿炳）的代表作；古琴曲*《流水》*以滚拂手法写水势。人曲不能串。"}],
 ex:{t:"选择题：某民歌由一人领唱、众人合唱，节奏与抬木动作严格同步，它属于哪类？解：使用场合是集体劳动、形式是一领众合，判为*号子*。最像的干扰项是山歌——山歌虽也高亢，但唱在山野、节奏自由且不配合劳动动作，故排除。"},
 traps:["号子≠山歌：差别在场合——号子配合劳动一领众合，山歌山野放声节奏自由。","京韵大鼓≠京剧：差别在形态——大鼓是说唱一人主唱，京剧是角色扮演的戏曲。","江南丝竹≠广东音乐：差别在领衔——丝竹以笛箫二胡，广东音乐以高胡。"]},

 map:{t:"外国民族音乐与流行音乐（一张图看懂）", kids:[
   {t:"亚洲：各有体系名片", kids:["印度：拉格（旋律框架）＋塔拉（节奏体系），西塔尔、塔布拉鼓","日本：雅乐，尺八、三味线、十三弦筝","印尼：甘美兰，以铜锣类乐器合奏"]},

   {t:"流行源流：一条先后线", kids:["布鲁斯：十二小节框架，先出现","爵士：即兴与切分，承布鲁斯而来","摇滚：电声乐队编制，其后兴起"]}]},
 points:[
  {h:"印度：两个体系词", t:"印度古典音乐的骨是*拉格*（旋律框架）与*塔拉*（节奏体系）；代表乐器*西塔尔*（弹拨）和塔布拉鼓（成对的手鼓）。题目给体系名反推国别最常见。"},
  {h:"日本印尼：乐器认脸", t:"日本*雅乐*是宫廷乐舞，乐器记*尺八*（竹管）、三味线、十三弦筝；印尼*甘美兰*是铜锣类乐器组成的大型合奏。两组乐器不要互相串。"},
  {h:"非洲拉美：节奏招牌", t:"非洲音乐以*鼓乐*为核心，节奏交错、常用一领众合的呼应歌唱；拉美记三样：阿根廷*探戈*、巴西*桑巴*、古巴伦巴，国别对位是考点。"},
  {h:"流行先后：布爵摇", t:"源流顺序是*布鲁斯→爵士→摇滚*：布鲁斯有固定的*十二小节*框架；爵士强调*即兴*和切分；摇滚以电吉他、贝斯、鼓的电声乐队编制为标志。"},
  {h:"抓分法：四样对位", t:"这类题信息面宽但深度浅，复习只抓*地区、乐器、节奏特征、用途*四样对位即可，不追作曲家与作品细节；本单元预计 20 分钟，性价比在「不丢浅分」。"}],
 ex:{t:"选择题：下列对位正确的是哪项？解：逐项验——印度·西塔尔对、印尼·甘美兰对、阿根廷·探戈对、巴西·探戈错（巴西的招牌是*桑巴*）。最像的干扰项是把探戈记给巴西——探戈源于阿根廷，故排除。"},
 traps:["探戈≠桑巴：差别在国别——探戈属阿根廷，桑巴属巴西。","拉格≠乐曲名：差别在类别——拉格是旋律框架体系，不是某首作品。","布鲁斯≠爵士：差别在重心——布鲁斯重固定框架，爵士重即兴发挥。"]},

 anchor:"四素养：感知打头，表现落地，创意与理解收尾",
 map:{t:"义务教育艺术课标（2022 年版）· 音乐（一张图看懂）", kids:[
   {t:"核心素养：四个词", kids:["审美感知：对音乐的感知、理解与判断","艺术表现：演唱、演奏、综合艺术表演","创意实践：即兴编创与综合创编","文化理解：认识音乐与生活、历史、文化的关系"]},
   {t:"课程内容：四类艺术实践", kids:["欣赏：听辨与评述","表现：演唱与演奏","创造：探索与编创","联系：音乐与姊妹艺术、社会生活相连"]},

   {t:"评价与实施口径", kids:["过程性评价与终结性评价结合","教学评一致：目标、教学、评价对齐"]}]},
 points:[
  {h:"先认版本：2022 艺术课标", t:"现行是*《义务教育艺术课程标准（2022 年版）》*，音乐不再单独成册，而是艺术课程的一部分。题目里出现旧版「音乐课程标准（2011 年版）」表述时，先*核对版本*再作答。"},
  {h:"四素养：逐个落义", t:"*审美感知*管听与判断，*艺术表现*管唱奏与表演，*创意实践*管即兴与编创，文化理解管音乐背后的历史文化。四词是本单元所有题目的母版。"},
  {h:"四类实践：内容骨架", t:"课程内容按*欣赏、表现、创造、联系*四类艺术实践组织。设计题写教学过程时，环节能对上这四类，结构就站得住；只唱不听、只听不创都是缺项。"},
  {h:"学段定位：第四学段", t:"义务教育分四个学段，初中对应*第四学段（7–9 年级）*。这一段的要求强调综合运用与合作探究，学情分析和目标撰写都要引用这个定位。"},
  {h:"评价口径：两种结合", t:"课标主张*过程性评价*与*终结性评价*相结合，并强调*教、学、评一致*。案例题问「评价方式单一」时，标准答法就是补过程性评价与多元主体。"},
  {h:"设计引用：写进教案", t:"教学设计题的理念与目标要能*回扣课标原话*：以审美感知为起点、在艺术表现中落实、给创意实践留环节、用文化理解收尾。空泛写「培养兴趣」不算引用。"}],
 ex:{t:"选择题：依据 2022 年版艺术课标，下列不属于音乐核心素养的是哪项？解：母版是*审美感知、艺术表现、创意实践、文化理解*。选项中的「音乐基础」是旧提法里的知识领域，不是核心素养，故选它。最像的干扰项「艺术表现」——它正是四素养之一，故排除。"},
 traps:["审美感知≠审美体验：差别在版本——现行课标素养名是审美感知。","联系≠欣赏：差别在指向——联系指音乐与其他艺术及社会生活的关联。","过程性评价≠课堂提问：差别在系统性——过程性评价要有记录与反馈闭环。"]},

 if(Q.idx >= Q.list.length){ h += '<div class="empty">这套做完了：'+Q.list.length+' 题，答对 '+Q.score+' 题。</div><div style="text-align:center"><button class="btn" id="qAgain">再选一套</button></div></div>'; return h; }
 const item = Q.list[Q.idx]; const q = item.q;
 h += '<div class="mut">' + esc(Q.sj) + ' · ' + esc(item.ut) + ' · 第 ' + (Q.idx+1) + ' / ' + Q.list.length + ' 题' + (Q.mode==="mock" ? ' · 已答对 ' + Q.score : '') + '</div>';
 h += '<div class="q"><p>' + esc(q.q) + '</p>' + q.opts.map((o,i)=>'<button class="opt" data-qopt="'+i+'">'+esc(o)+'</button>').join("") + '<div class="why" id="qWhy"></div></div>';
 h += '<div style="display:flex;gap:8px;margin-top:6px"><button class="btn sm ghost" id="qQuit">退出</button><button class="btn sm" id="qNext" style="display:none">下一题</button></div></div>';
 return h; }
function bind(){

 document.querySelectorAll("[data-res]").forEach(c=>c.onchange=()=>{ const v=c.dataset.res; S.res = S.res||[]; if(c.checked){ if(!S.res.includes(v)) S.res.push(v); } else { S.res = S.res.filter(x=>x!==v); } save(); });
 document.querySelectorAll("[data-uep]").forEach(b=>b.onclick=()=>{ const parts=b.dataset.uep.split("|"); const box=document.getElementById("up-"+parts[2]); if(box) box.innerHTML='<div class="player"><iframe src="'+bvEmbed(parts[0], parts[1])+'" allowfullscreen="true" scrolling="no"></iframe></div>'; });

 document.querySelectorAll("[data-toguide]").forEach(b=>b.onclick=()=>{ S.view="guide"; save(); render(); window.scrollTo(0,0); });
 document.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{ const uid=b.dataset.goto; for(const tk of Object.keys(PACK.tracks)){ if(findUnit(tk,uid)){ S.track=tk; break; } } S.openUid=uid; S.view="course"; save(); render(); window.scrollTo(0,0); });
 document.querySelectorAll("[data-gt]").forEach(ob=>ob.onclick=()=>{ const parts=ob.dataset.gt.split("|"); const st=GUIDE[+parts[0]]; const oi=+parts[1]; const box=ob.closest(".gtest"); const why=box.querySelector(".why"); box.querySelectorAll(".opt").forEach(x=>x.classList.remove("ok","bad")); if(oi===st.test.a){ ob.classList.add("ok"); why.textContent="答对了。"+st.test.why; } else { ob.classList.add("bad"); box.querySelectorAll(".opt")[st.test.a].classList.add("ok"); why.textContent="再想想。"+st.test.why; } why.classList.add("show"); });
 document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{ const box=document.getElementById("playerBox"); if(box) box.innerHTML='<div class="player"><iframe src="'+(function(){ const pp=b.dataset.play.split("|"); return bvEmbed(pp[0], pp[1]); })()+'" allowfullscreen="true" scrolling="no"></iframe></div>'; });
 document.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{ const box=document.getElementById("playerBox"); if(box) box.innerHTML='<div class="player"><iframe src="'+(function(){ const pp=b.dataset.play.split("|"); return bvEmbed(pp[0], pp[1]); })()+'" allowfullscreen="true" scrolling="no"></iframe></div>'; });
 document.querySelectorAll("[data-quiz]").forEach(b=>b.onclick=()=>{ const parts=b.dataset.quiz.split("|"); startQuiz(parts[0], parts[1]); });
 const qAgain=document.getElementById("qAgain"); if(qAgain) qAgain.onclick=()=>{ Q=null; render(); };
 const qQuit=document.getElementById("qQuit"); if(qQuit) qQuit.onclick=()=>{ Q=null; S.view="course"; save(); render(); };
 const qNext=document.getElementById("qNext"); if(qNext) qNext.onclick=()=>{ Q.idx++; Q.answered=false; render(); };
 document.querySelectorAll("[data-qopt]").forEach(ob=>ob.onclick=()=>{ if(!Q || Q.answered) return; Q.answered=true; const item=Q.list[Q.idx]; const q=item.q; const oi=+ob.dataset.qopt; const why=document.getElementById("qWhy"); document.querySelectorAll("[data-qopt]").forEach(x=>x.classList.remove("ok","bad")); if(oi===q.a){ ob.classList.add("ok"); Q.score++; if(why){ why.textContent="答对了。"+q.why; why.classList.add("show"); } } else { ob.classList.add("bad"); document.querySelectorAll("[data-qopt]")[q.a].classList.add("ok"); if(why){ why.textContent="答错了，已记入错题本。"+q.why; why.classList.add("show"); } if(!S.wrong.some(w=>w.tid===Q.tid&&w.uid===item.uid&&w.qi===item.qi)){ S.wrong.push({tid:Q.tid, uid:item.uid, qi:item.qi}); save(); } } const nx=document.getElementById("qNext"); if(nx) nx.style.display=""; });
 document.querySelectorAll("[data-done]").forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const uid=b.dataset.done; if(S.done[uid]) delete S.done[uid]; else S.done[uid]=weekKey(); save(); render(); });
 document.querySelectorAll("[data-open]").forEach(r=>r.onclick=()=>{ const uid=r.dataset.open; S.openUid = (S.openUid===uid? null: uid); save(); render(); });
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ S.openUid=b.dataset.go; S.view="course"; save(); render(); window.scrollTo(0,0); });
 document.querySelectorAll(".q").forEach(qel=>{ const key=qel.dataset.qkey; const parts=key.split("|"); const tid=parts[0], uid=parts[1], qi=+parts[2]; const f=findUnit(tid,uid); if(!f) return; const q=f.u.qs[qi]; qel.querySelectorAll(".opt").forEach(ob=>ob.onclick=()=>{ const oi=+ob.dataset.oi; const why=qel.querySelector(".why"); qel.querySelectorAll(".opt").forEach(x=>x.classList.remove("ok","bad")); if(oi===q.a){ ob.classList.add("ok"); if(why){ why.textContent="答对了。"+q.why; why.classList.add("show"); } const ix=S.wrong.findIndex(w=>w.tid===tid&&w.uid===uid&&w.qi===qi); if(ix>=0 && S.view==="wrong"){ S.wrong.splice(ix,1); save(); setTimeout(render,600); } } else { ob.classList.add("bad"); qel.querySelectorAll(".opt")[q.a].classList.add("ok"); if(why){ why.textContent="再想想。正确答案已标出："+q.why; why.classList.add("show"); } if(!S.wrong.some(w=>w.tid===tid&&w.uid===uid&&w.qi===qi)){ S.wrong.push({tid,uid,qi}); save(); } } }); });
 const whs=document.getElementById("whSave"); if(whs) whs.onclick=()=>{ const v=parseFloat(document.getElementById("wh").value); if(v>0){ S.weekly=Math.round(v*60); save(); render(); } };
 const cp=document.getElementById("cp"); if(cp) cp.onclick=()=>{ const t=document.getElementById("codeBox"); t.select(); try{ document.execCommand("copy"); cp.textContent="已复制"; }catch(e){ cp.textContent="已选中，长按复制"; } setTimeout(()=>cp.textContent="复制进度码",1500); };
 const ib=document.getElementById("impBtn"); if(ib) ib.onclick=()=>{ try{ const v=document.getElementById("imp").value.trim(); const obj=JSON.parse(decodeURIComponent(escape(atob(v)))); if(obj && obj.track){ S=obj; save(); render(); alert("导入成功"); } }catch(e){ alert("进度码不对，检查一下有没有复制全"); } };
 const rs=document.getElementById("reset"); if(rs) rs.onclick=()=>{ if(confirm("确定清空全部进度吗？")){ try{ localStorage.removeItem(LS_KEY); }catch(e){} MEM=null; S={track:"junior", view:"today", done:{}, wrong:[], weekly:300, openUid:null, res:[]}; render(); } };
}
render();
</script>
</body>
</html>
